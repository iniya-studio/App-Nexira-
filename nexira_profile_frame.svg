<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <title>NEXIRA Profile Frame</title>
  <defs>
    <!-- Clip: only the ring (r 356 to 508) can ever receive paint. The center is guaranteed empty. -->
    <clipPath id="ringClip" clip-rule="evenodd">
      <path clip-rule="evenodd" d="M -508 0 A508 508 0 1 0 508 0 A508 508 0 1 0 -508 0 Z M -356 0 A356 356 0 1 0 356 0 A356 356 0 1 0 -356 0 Z"/>
    </clipPath>

    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="-500" x2="0" y2="500">
      <stop offset="0" stop-color="#3a78c8"/>
      <stop offset="0.22" stop-color="#1b4a93"/>
      <stop offset="0.55" stop-color="#0b1f4f"/>
      <stop offset="1" stop-color="#050d2a"/>
    </linearGradient>
    <linearGradient id="cyan" gradientUnits="userSpaceOnUse" x1="0" y1="-500" x2="0" y2="500">
      <stop offset="0" stop-color="#b8fdff"/>
      <stop offset="0.35" stop-color="#26e6f2"/>
      <stop offset="0.75" stop-color="#0a8fd0"/>
      <stop offset="1" stop-color="#0a4f9e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2c2ff"/>
      <stop offset="1" stop-color="#6a3fd8"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa0e6"/>
      <stop offset="0.45" stop-color="#1e55a6"/>
      <stop offset="1" stop-color="#0a1c48"/>
    </linearGradient>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="-500" x2="0" y2="500">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Cardinal plate (top position) -->
    <g id="plateMajor">
      <polygon points="0,-506 46,-470 38,-410 0,-390 -38,-410 -46,-470" fill="url(#plate)" stroke="#06112e" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="0,-498 39,-466 32,-414 0,-398 -32,-414 -39,-466" fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-482 13,-452 0,-422 -13,-452" fill="#5ff3ff" stroke="#e8ffff" stroke-width="2" filter="url(#glow)"/>
      <line x1="0" y1="-476" x2="0" y2="-428" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>

    <!-- Diagonal plate (top position) -->
    <g id="plateMinor">
      <polygon points="0,-494 28,-468 23,-420 0,-406 -23,-420 -28,-468" fill="url(#plate)" stroke="#06112e" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="0,-487 22,-465 18,-424 0,-413 -18,-424 -22,-465" fill="none" stroke="#8f6bff" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="0,-472 8,-452 0,-432 -8,-452" fill="url(#violet)" stroke="#efe8ff" stroke-width="1.5"/>
    </g>
  </defs>

  <g transform="translate(512 512)">
    <g clip-path="url(#ringClip)">

      <!-- Base metallic ring -->
      <path fill-rule="evenodd" fill="url(#metal)" d="M -496 0 A496 496 0 1 0 496 0 A496 496 0 1 0 -496 0 Z M -356 0 A356 356 0 1 0 356 0 A356 356 0 1 0 -356 0 Z"/>

      <!-- Recessed energy channel -->
      <circle r="428" fill="none" stroke="#040a20" stroke-opacity="0.75" stroke-width="46"/>
      <circle r="406" fill="none" stroke="#2f7fd0" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="450" fill="none" stroke="#2f7fd0" stroke-opacity="0.55" stroke-width="1.5"/>

      <!-- Segmented energy track (24 segments, centered on the top) -->
      <circle r="428" fill="none" stroke="#1ee3f0" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="76 36" stroke-dashoffset="38" transform="rotate(-90)" filter="url(#glow)"/>
      <circle r="428" fill="none" stroke="#d9ffff" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round"
              stroke-dasharray="76 36" stroke-dashoffset="38" transform="rotate(-90)"/>

      <!-- Fine tick marks near outer rim -->
      <circle r="474" fill="none" stroke="#7fd8ff" stroke-opacity="0.45" stroke-width="9"
              stroke-dasharray="2.5 28.64" transform="rotate(-90)"/>

      <!-- Violet accent arcs (centered on diagonals) -->
      <circle r="384" fill="none" stroke="#8f6bff" stroke-width="3.5" stroke-linecap="round"
              stroke-dasharray="300 303.2" stroke-dashoffset="150" transform="rotate(45)"/>
      <circle r="384" fill="none" stroke="#06112e" stroke-opacity="0.6" stroke-width="1.5"
              transform="rotate(0)" stroke-dasharray="0 4000"/>

      <!-- Inner bezel (hard, clean edge around the avatar window) -->
      <circle r="366" fill="none" stroke="#050d28" stroke-width="9"/>
      <circle r="361" fill="none" stroke="url(#cyan)" stroke-width="3.5"/>
      <circle r="371" fill="none" stroke="#9fe8ff" stroke-opacity="0.55" stroke-width="1.5"/>

      <!-- Outer rim: bevel, highlight, and dark separation edge -->
      <circle r="490" fill="none" stroke="url(#cyan)" stroke-width="6"/>
      <circle r="483" fill="none" stroke="#06112e" stroke-opacity="0.7" stroke-width="2"/>
      <circle r="495" fill="none" stroke="#030917" stroke-width="3"/>

      <!-- Mirrored specular highlights -->
      <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
        <path d="M -343.7 -343.7 A486 486 0 0 1 -84.4 -478.6"/>
        <path transform="scale(-1 1)" d="M -343.7 -343.7 A486 486 0 0 1 -84.4 -478.6"/>
      </g>

      <!-- Plates: 4 major (cyan), 4 minor (violet) -->
      <use href="#plateMajor"/>
      <use href="#plateMajor" transform="rotate(90)"/>
      <use href="#plateMajor" transform="rotate(180)"/>
      <use href="#plateMajor" transform="rotate(270)"/>
      <use href="#plateMinor" transform="rotate(45)"/>
      <use href="#plateMinor" transform="rotate(135)"/>
      <use href="#plateMinor" transform="rotate(225)"/>
      <use href="#plateMinor" transform="rotate(315)"/>

      <!-- Global top-light / bottom-shade for material depth -->
      <path fill-rule="evenodd" fill="url(#shade)" d="M -496 0 A496 496 0 1 0 496 0 A496 496 0 1 0 -496 0 Z M -356 0 A356 356 0 1 0 356 0 A356 356 0 1 0 -356 0 Z"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
