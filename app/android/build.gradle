// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Kotlin 1.8+ merged the JDK7/JDK8 extension classes into kotlin-stdlib.
    // Align legacy transitive variants (currently requested as 1.6.21 by
    // kotlinx-coroutines 1.6.4 through AndroidX lifecycle) with the resolved
    // kotlin-stdlib 1.8.22 to prevent duplicate classes on Android test classpaths.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                (details.requested.name == 'kotlin-stdlib-jdk7' ||
                 details.requested.name == 'kotlin-stdlib-jdk8')) {
                details.useVersion '1.8.22'
                details.because 'Align legacy JDK stdlib artifacts with kotlin-stdlib 1.8.22; JDK7/JDK8 classes were merged into kotlin-stdlib in Kotlin 1.8.'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
