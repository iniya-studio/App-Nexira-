name: NEXIRA Android APK

on:
  push:
    branches:
      - main
      - feature/android-keystore-recovery-proof
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build and verify Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend and match-engine tests
        run: npm test

      - name: Sync web assets for instrumentation tests
        run: npm run android:sync

      - name: Run Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          # The test only exercises Android framework Keystore APIs; Google Play services
          # are not required. Use the lean AOSP image to avoid unrelated GMS startup load.
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          working-directory: app/android
          # android-emulator-runner parses this input as one shell command per physical line.
          # Keep failure handling and post-test diagnostics inside a single bash process.
          script: |
            bash -c 'set +e; ./gradlew connectedDebugAndroidTest --stacktrace; TEST_EXIT=$?; mkdir -p build/android-instrumentation-diagnostics; adb devices -l > build/android-instrumentation-diagnostics/adb-devices.txt 2>&1 || true; adb logcat -d -b all -v threadtime > build/android-instrumentation-diagnostics/logcat-all.txt 2>&1 || true; adb shell dumpsys activity processes > build/android-instrumentation-diagnostics/activity-processes.txt 2>&1 || true; adb shell dumpsys activity lastanr > build/android-instrumentation-diagnostics/last-anr.txt 2>&1 || true; adb shell dumpsys dropbox --print data_app_anr > build/android-instrumentation-diagnostics/dropbox-data-app-anr.txt 2>&1 || true; adb shell dumpsys package com.nexira.prototype > build/android-instrumentation-diagnostics/package-info.txt 2>&1 || true; exit "$TEST_EXIT"'

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            app/android/build/android-instrumentation-diagnostics/
            app/android/app/build/reports/androidTests/connected/debug/
            app/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Build web app and Android package
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}
          VITE_APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}
        run: npm run android:apk

      - name: Verify APK artifact
        run: |
          test -s build/NEXIRA-Android.apk
          ls -lh build/NEXIRA-Android.apk

      - name: Upload NEXIRA debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXIRA-Android-debug
          path: app/build/NEXIRA-Android.apk
          if-no-files-found: error
          retention-days: 14
