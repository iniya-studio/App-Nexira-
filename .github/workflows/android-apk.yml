name: NEXIRA Android APK

on:
  push:
    branches:
      - main
      - feature/android-keystore-recovery-proof
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build and verify Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend and match-engine tests
        run: npm test

      - name: Sync web assets for instrumentation tests
        run: npm run android:sync

      - name: Run Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: app/android
          script: ./gradlew connectedDebugAndroidTest

      - name: Build web app and Android package
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}
          VITE_APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}
        run: npm run android:apk

      - name: Verify APK artifact
        run: |
          test -s build/NEXIRA-Android.apk
          ls -lh build/NEXIRA-Android.apk

      - name: Upload NEXIRA debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXIRA-Android-debug
          path: app/build/NEXIRA-Android.apk
          if-no-files-found: error
          retention-days: 14
