name: Backend CI

on:
  workflow_dispatch:

  push:
    branches:
      - feature/backend-foundation
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - feature/backend-foundation
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexira_ci?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply official Prisma formatter and report diff
        run: |
          npx prisma format
          git --no-pager diff -- prisma/schema.prisma
          git diff --exit-code -- prisma/schema.prisma

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build NestJS for production
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run ESLint
        run: npm run lint
